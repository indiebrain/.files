# Omarchy settings for these dotfiles.
#
# Sourced by omarchy/install. Override any of these per host in
# ~/.config/dotfiles-omarchy/overlay.conf (same syntax, loaded after this file).

# The dotfiles repo this directory lives in.
DOTFILES_DIR="$(dirname "$OVERLAY_DIR")"

# Stow packages to link into $HOME on Omarchy. hypr is Omarchy-only.
# Left out on purpose: iterm2, gnome-terminal, ollama (macOS/GNOME only).
DOTFILES_STOW=(
  asdf
  bash
  btop
  emacs
  firefox
  ghostty
  git
  herdr
  hypr
  k9s
  proselint
  ripgrep
  ruby
  scripts
  ssh
)

# Omarchy defaults (set through Omarchy's own `omarchy default ...` commands).
DEFAULT_TERMINAL="ghostty"
DEFAULT_EDITOR="emacs"
# Omarchy's `omarchy default browser` only knows a fixed list (chromium,
# chrome, brave, edge, firefox, zen). Anything else is set as the XDG default
# directly via its .desktop file, which is what Omarchy's launcher reads.
DEFAULT_BROWSER="firefox-developer-edition"
DEFAULT_BROWSER_DESKTOP="firefox-developer-edition.desktop"

# Run `emacs --daemon` as a systemd user service so emacsclient is instant.
EMACS_DAEMON=true

# Install Ollama (GPU build picked automatically) and run it as a system
# service with the settings in omarchy/ollama/ollama.service.conf.
OLLAMA=true
# OLLAMA_PACKAGE="ollama-vulkan"   # pin a build instead of auto-detecting

# Remove Omarchy's preinstalled web apps, TUI wrappers, mise stubs and apps by
# running Omarchy's own `omarchy-remove-preinstalls`, so the list tracks upstream.
REMOVE_PREINSTALLS=true

# How much of Omarchy's bash setup to load from ~/.bashrc.local:
#   env  - only OMARCHY_PATH/PATH bootstrap (keeps your prompt and aliases intact)
#   full - Omarchy's aliases, functions, starship, zoxide, fzf, etc. as well
OMARCHY_BASH="env"
