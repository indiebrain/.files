# systemd drop-in for Arch's ollama.service. Installed by omarchy/install to
# /etc/systemd/system/ollama.service.d/10-dotfiles.conf.
#
# Linux counterpart of ollama/Library/LaunchAgents/com.aaron-kuehler.ollama.plist:
# keep the two in sync. The server runs as the `ollama` system user, so the
# OLLAMA_* exports in .bashrc never reach it; this file is the source of truth.
#
# The values were sized on the 128 GB Mac (see the plist for the reasoning).
# On a machine with less memory, lower OLLAMA_MAX_LOADED_MODELS and
# OLLAMA_CONTEXT_LENGTH first.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
Environment="OLLAMA_KEEP_ALIVE=15m"
Environment="OLLAMA_REQUEST_TIMEOUT=300s"
